# config/model_registry.yml
#
# Stage 6 (ModelRegistry/ModelSelector, app/services/models_registry/) —
# the "swappable model registry" done for real this time: read directly by
# ModelSelector at request time, not just by an offline training script.
# Every algorithm, ML or deterministic, registers the same shape — a
# deterministic fallback is not a special case bolted onto an analyzer,
# it's a first-class entry selected by the same mechanism.
#
# requires_ml=false entries are what "Improve Current Fallbacks" adds on
# top of today's single flat method per analysis type (see the plan).
# enabled=false entries need a dependency not yet installed (statsmodels/
# pmdarima for ARIMA, catboost, mlxtend for Apriori) — Phase 6, optional.

algorithms:
  # ── forecast ────────────────────────────────────────────────────────────
  - algorithm: Prophet
    purpose: forecast
    requirements: {requires_ml: true, min_rows: 24, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [forecast_values, confidence_interval, trend_components]
    cost_tier: expensive
    supported_dataset_types: []
    implementation_class: app.services.ml.forecaster.ProphetForecaster
    enabled: true

  - algorithm: ARIMA
    purpose: forecast
    requirements: {requires_ml: true, min_rows: 12, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [forecast_values, confidence_interval]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.forecaster.ARIMAForecaster
    enabled: false   # needs statsmodels/pmdarima — Phase 6

  - algorithm: XGBoost Regressor
    purpose: forecast
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [forecast_values, feature_importances]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.forecaster.LightGBMForecaster
    enabled: true

  - algorithm: Moving Average
    purpose: forecast
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [forecast_values]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.forecast_strategies.MovingAverageStrategy
    enabled: true

  - algorithm: Linear Trend
    purpose: forecast
    requirements: {requires_ml: false, min_rows: 5, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [forecast_values, trend_slope]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.forecast_strategies.LinearTrendStrategy
    enabled: true

  - algorithm: Exponential Smoothing
    purpose: forecast
    requirements: {requires_ml: false, min_rows: 5, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [forecast_values, smoothed_series]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.forecast_strategies.ExponentialSmoothingStrategy
    enabled: true

  # ── regression ──────────────────────────────────────────────────────────
  - algorithm: LightGBM Regressor
    purpose: regression
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [predictions, feature_importances, r2, rmse]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.forecaster.LightGBMForecaster
    enabled: true

  - algorithm: Random Forest Regressor
    purpose: regression
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [predictions, feature_importances, r2]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.regression_strategies.RandomForestRegressorStrategy
    enabled: true

  - algorithm: CatBoost Regressor
    purpose: regression
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [predictions, feature_importances, r2]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.regression_strategies.CatBoostRegressorStrategy
    enabled: false   # needs catboost — Phase 6

  - algorithm: Linear Regression
    purpose: regression
    requirements: {requires_ml: false, min_rows: 5, requires_datetime: false, requires_target: true, supports_categorical: false}
    inputs: [metric]
    outputs: [predictions, r2, coefficients]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.regression_strategies.LinearRegressionStrategy
    enabled: true

  # ── classification ──────────────────────────────────────────────────────
  - algorithm: XGBoost Classifier
    purpose: classification
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [predictions, class_probabilities, accuracy, f1_macro, shap_values]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.classifier.VarianceClassifier
    enabled: true

  - algorithm: Random Forest Classifier
    purpose: classification
    requirements: {requires_ml: true, min_rows: 30, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [predictions, class_probabilities, accuracy]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.classification_strategies.RandomForestClassifierStrategy
    enabled: true

  - algorithm: Logistic Regression
    purpose: classification
    requirements: {requires_ml: true, min_rows: 20, requires_datetime: false, requires_target: true, supports_categorical: false}
    inputs: [metric]
    outputs: [predictions, class_probabilities, accuracy]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.classification_strategies.LogisticRegressionStrategy
    enabled: true

  - algorithm: Majority Class Baseline
    purpose: classification
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [dimension]
    outputs: [predictions]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.classification_strategies.MajorityClassBaselineStrategy
    enabled: true

  # ── clustering / segmentation ──────────────────────────────────────────
  - algorithm: K-Means
    purpose: segmentation
    requirements: {requires_ml: true, min_rows: 10, requires_datetime: false, requires_target: false, supports_categorical: false, min_feature_columns: 2}
    inputs: [metric]
    outputs: [cluster_assignments, centroids, inertia]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.classifier.RiskSegmenter
    enabled: true

  - algorithm: DBSCAN
    purpose: segmentation
    requirements: {requires_ml: true, min_rows: 10, requires_datetime: false, requires_target: false, supports_categorical: false, min_feature_columns: 2}
    inputs: [metric]
    outputs: [cluster_assignments, noise_points]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.clustering_strategies.DBSCANStrategy
    enabled: true

  - algorithm: Hierarchical Clustering
    purpose: segmentation
    requirements: {requires_ml: true, min_rows: 10, requires_datetime: false, requires_target: false, supports_categorical: false, min_feature_columns: 2}
    inputs: [metric]
    outputs: [cluster_assignments, dendrogram]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.clustering_strategies.AgglomerativeClusteringStrategy
    enabled: true

  - algorithm: Quantile Binning
    purpose: segmentation
    requirements: {requires_ml: false, min_rows: 4, requires_datetime: false, requires_target: false, supports_categorical: false}
