    implementation_class: app.services.analyzers.segmentation_strategies.EqualWidthBinningStrategy
    enabled: true

  - algorithm: Equal-Frequency Binning
    purpose: segmentation
    requirements: {requires_ml: false, min_rows: 4, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [segment_assignments, bin_edges]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.segmentation_strategies.EqualFrequencyBinningStrategy
    enabled: true

  - algorithm: Insurance Combined Ratio Buckets
    purpose: segmentation
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [segment_assignments]
    cost_tier: cheap
    supported_dataset_types: [Insurance]
    implementation_class: app.services.domain_plugins.insurance.plugin.InsuranceCombinedRatioBucketsStrategy
    enabled: true   # only ever selected via InsurancePlugin.get_preferred_deterministic_strategy() — not a generic default

  - algorithm: Categorical Grouping
    purpose: segmentation
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [dimension]
    outputs: [segment_assignments]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.segmentation_strategies.CategoricalGroupingStrategy
    enabled: true

  - algorithm: K-Means (clustering)
    purpose: clustering
    requirements: {requires_ml: true, min_rows: 10, requires_datetime: false, requires_target: false, supports_categorical: false, min_feature_columns: 2}
    inputs: [metric]
    outputs: [cluster_assignments, centroids, inertia]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.ml.classifier.RiskSegmenter
    enabled: true

  - algorithm: Quantile Binning (clustering)
    purpose: clustering
    requirements: {requires_ml: false, min_rows: 4, requires_datetime: false, requires_target: false, supports_categorical: false}
