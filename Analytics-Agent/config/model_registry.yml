    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [dimension]
    outputs: [cluster_assignments]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.segmentation_strategies.CategoricalGroupingStrategy
    enabled: true

