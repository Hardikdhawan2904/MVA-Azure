    cost_tier: expensive
    supported_dataset_types: []
    implementation_class: app.services.analyzers.anomaly_strategies.OneClassSVMStrategy
    enabled: true

  - algorithm: Z-Score
    purpose: anomaly_detection
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [anomaly_flags, deviation_stds]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.anomaly_strategies.ZScoreStrategy
    enabled: true

  - algorithm: IQR
    purpose: anomaly_detection
    requirements: {requires_ml: false, min_rows: 4, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [anomaly_flags, iqr_bounds]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.anomaly_strategies.IQRStrategy
    enabled: true

  - algorithm: Modified Z-Score (MAD)
    purpose: anomaly_detection
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [anomaly_flags, deviation_mad]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.anomaly_strategies.ModifiedZScoreStrategy
    enabled: true

  # ── feature_importance ──────────────────────────────────────────────────
  - algorithm: SHAP
    purpose: feature_importance
    requirements: {requires_ml: true, min_rows: 20, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [feature_contributions, shap_values]
    cost_tier: expensive
    supported_dataset_types: []
    implementation_class: app.services.ml.classifier.VarianceClassifier
    enabled: true

  - algorithm: Permutation Importance
    purpose: feature_importance
    requirements: {requires_ml: true, min_rows: 20, requires_datetime: false, requires_target: true, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [feature_contributions]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.feature_importance_strategies.PermutationImportanceStrategy
    enabled: true

  - algorithm: Correlation-Based Importance
    purpose: feature_importance
    requirements: {requires_ml: false, min_rows: 5, requires_datetime: false, requires_target: true, supports_categorical: false}
    inputs: [metric]
    outputs: [feature_contributions]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.feature_importance_strategies.CorrelationBasedImportanceStrategy
    enabled: true

  # ── correlation ─────────────────────────────────────────────────────────
  - algorithm: Pearson
    purpose: correlation
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [correlation_matrix, p_values]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.correlation_strategies.PearsonStrategy
    enabled: true

  - algorithm: Spearman
    purpose: correlation
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [correlation_matrix, p_values]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.correlation_strategies.SpearmanStrategy
    enabled: true

  # ── association_rules ───────────────────────────────────────────────────
  - algorithm: Apriori
    purpose: association_rules
    requirements: {requires_ml: false, min_rows: 10, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [dimension]
    outputs: [frequent_itemsets, rules, support, confidence, lift]
    cost_tier: moderate
    supported_dataset_types: []
    implementation_class: app.services.analyzers.association_strategies.AprioriStrategy
    enabled: false   # needs mlxtend — Phase 6

  - algorithm: Contingency Table Co-occurrence
    purpose: association_rules
    requirements: {requires_ml: false, min_rows: 5, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [dimension]
    outputs: [co_occurrence_matrix, conditional_probabilities]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.association_strategies.ContingencyTableStrategy
    enabled: true   # pandas crosstab-based — always available, no mlxtend needed

  # ── always-deterministic analysis types (no ML variant by design) ─────
  - algorithm: Trend (linear regression over time)
    purpose: trend
    requirements: {requires_ml: false, min_rows: 2, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [trend_direction, trend_slope]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.tools.analytics_tool.AnalyticsTool
    enabled: true

  - algorithm: Descriptive Distribution
    purpose: distribution_analysis
    requirements: {requires_ml: false, min_rows: 2, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [metric]
    outputs: [percentiles, histogram_bins]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.distribution_strategies.DescriptiveDistributionStrategy
    enabled: true

  - algorithm: Ranking
    purpose: ranking
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [ranked_records]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.tools.analytics_tool.AnalyticsTool
    enabled: true

  - algorithm: Comparative Groupby
    purpose: comparative_analysis
    requirements: {requires_ml: false, min_rows: 2, requires_datetime: false, requires_target: false, supports_categorical: true}
    inputs: [metric, dimension]
    outputs: [group_comparison]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.tools.analytics_tool.AnalyticsTool
    enabled: true

  - algorithm: Deterministic Driver Decomposition
    purpose: root_cause
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [driver_breakdown, primary_driver, explained_variance]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.tools.root_cause_tool.RootCauseTool
    enabled: true

  - algorithm: Time Series Descriptive
    purpose: time_series_analysis
    requirements: {requires_ml: false, min_rows: 2, requires_datetime: true, requires_target: false, supports_categorical: false}
    inputs: [temporal_dimension, metric]
    outputs: [series_summary, seasonality_flag]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.time_series_strategies.TimeSeriesDescriptiveStrategy
    enabled: true

  - algorithm: Z-Score (outlier_detection)
    purpose: outlier_detection
    requirements: {requires_ml: false, min_rows: 3, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [outlier_flags, deviation_stds]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.anomaly_strategies.ZScoreStrategy
    enabled: true

  # ── kpi_summary / kpi_variance (Phase 4) ────────────────────────────────
  # Curated-KPI lookups (RuleEngine.get_kpi() + a domain plugin's actual/
  # budget/prior_year column mapping) — always deterministic by design, a
  # named business-metric comparison was never an algorithm-selection
  # decision. See app/services/analyzers/kpi_strategies.py.
  - algorithm: KPI Aggregation
    purpose: kpi_summary
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [actual, budget, variance_amount, variance_pct, direction]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.kpi_strategies.KPISummaryStrategy
    enabled: true

  - algorithm: KPI Variance Analysis
    purpose: kpi_variance
    requirements: {requires_ml: false, min_rows: 1, requires_datetime: false, requires_target: false, supports_categorical: false}
    inputs: [metric]
    outputs: [actual, budget, prior_year, variance_vs_budget_amount, variance_vs_prior_year_amount]
    cost_tier: cheap
    supported_dataset_types: []
    implementation_class: app.services.analyzers.kpi_strategies.KPIVarianceStrategy
    enabled: true
